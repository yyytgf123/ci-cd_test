plugins {
    id 'com.github.burrunan.s3-build-cache' version '1.9.5'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

ext.isCi = System.getenv('CI') != null

buildCache {
    local { enabled = !isCi }
    remote(com.github.burrunan.s3cache.AwsS3BuildCache) {
        region = 'us-east-1'
        bucket = 'my-ci-cache'
        prefix = 'gradle-build-cache/'
        endpoint = System.getenv('S3_ENDPOINT') ?: ''
        push = isCi
        lookupDefaultAwsCredentials = true
        awsAccessKeyId = System.getenv('AWS_ACCESS_KEY_ID') ?: ''
        awsSecretKey = System.getenv('AWS_SECRET_ACCESS_KEY') ?: ''
    }
}

rootProject.name = 'msa-shop'

include 'service:common'
include 'service:user'
include 'service:order'
